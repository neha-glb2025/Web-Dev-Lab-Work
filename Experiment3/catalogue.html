<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #94a3b8;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #bfdbfe;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Online Book Catalogue</h1>

    <table>
        <tr>
            <th>S.No.</th>
            <th>Book Title</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Wings of Fire</td>
            <td>A. P. J. Abdul Kalam</td>
            <td>Universities Press</td>
            <td>₹350</td>
            <td><button type="button">Add</button></td>
        </tr>

        <tr>
            <td>2</td>
            <td>The Alchemist</td>
            <td>Paulo Coelho</td>
            <td>HarperCollins</td>
            <td>₹250</td>
            <td><button type="button">Add</button></td>
        </tr>

        <tr>
            <td>3</td>
            <td>Rich Dad Poor Dad</td>
            <td>Robert Kiyosaki</td>
            <td>Plata Publishing</td>
            <td>₹400</td>
            <td><button type="button">Add</button></td>
        </tr>

        <tr>
            <td>4</td>
            <td>Atomic Habits</td>
            <td>James Clear</td>
            <td>Penguin Books</td>
            <td>₹450</td>
            <td><button type="button">Add</button></td>
        </tr>
    </table>
</body>
</html>
