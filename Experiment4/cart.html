<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #94a3b8;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #bfdbfe;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        button {
            padding: 10px 18px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Shopping Cart</h1>

    <table>
        <tr>
            <th>Book Title</th>
            <th>Author</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>Wings of Fire</td>
            <td>A. P. J. Abdul Kalam</td>
            <td>₹350</td>
            <td>1</td>
            <td>₹350</td>
        </tr>

        <tr>
            <td>The Alchemist</td>
            <td>Paulo Coelho</td>
            <td>₹250</td>
            <td>2</td>
            <td>₹500</td>
        </tr>

        <tr>
            <td>Atomic Habits</td>
            <td>James Clear</td>
            <td>₹450</td>
            <td>1</td>
            <td>₹450</td>
        </tr>
    </table>

    <p class="total">Total Amount: ₹1300</p>

    <div style="text-align: center;">
        <button type="button" onclick="alert('Order placed successfully!')">
            Place Order
        </button>
    </div>
</body>
</html>
