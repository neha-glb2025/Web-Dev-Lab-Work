<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Registration Form</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #eef4fb;
    margin: 0;
    padding: 20px;
}
h1 {
    text-align: center;
    color: #1e3a8a;
}
form {
    max-width: 600px;
    margin: auto;
    padding: 25px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 0 10px #cccccc;
}
label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #1e293b;
}
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="password"],
select,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    box-sizing: border-box;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
}
.options {
    margin-top: 8px;
}
input[type="submit"],
input[type="reset"] {
    padding: 10px 20px;
    margin: 20px 8px 0 0;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}
input[type="submit"] {
    background-color: #2563eb;
    color: white;
}
input[type="reset"] {
    background-color: #d1d5db;
    color: #374151;
}
</style>
</head>
<body>

<h1>Examination Registration Form</h1>

<form action="#" method="post">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="phone">Contact Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter contact number" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter password" minlength="6" required>

    <label for="confiirm">Confirm Password:</label>
    <input type="password" id="confiirm" name="confirm" placeholder="Re-enter password" minlength="6" required>

    <label>Gender:</label>
    <div class="options">
        <input type="radio" name="gender" value="Male" required> Male &nbsp;&nbsp;
        <input type="radio" name="gender" value="Female"> Female &nbsp;&nbsp;
        <input type="radio" name="gender" value="Other"> Other
    </div>

    <label for="course">Examination Course:</label>
    <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="BTech CSE">B.Tech CSE</option>
        <option value="BTech IT">B.Tech IT</option>
        <option value="BTech ECE">B.Tech ECE</option>
        <option value="BTech EEE">B.Tech EEE</option>
    </select>

    <label>Qualification:</label>
    <div class="options">
        <input type="radio" name="qualification" value="12th" required> 12th &nbsp;&nbsp;
        <input type="radio" name="qualification" value="Diploma"> Diploma &nbsp;&nbsp;
        <input type="radio" name="qualification" value="Other"> Other
    </div>

    <label>Hobbies:</label>
    <div class="options">
        <input type="checkbox" name="hobby" value="Reading"> Reading &nbsp;&nbsp;
        <input type="checkbox" name="hobby" value="Sports"> Sports &nbsp;&nbsp;
        <input type="checkbox" name="hobby" value="Music"> Music
    </div>

    <label for="address">Address:</label>
    <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>

    <div style="text-align: center;">
        <input type="submit" value="Submit Registration">
        <input type="reset" value="Reset Form">
    </div>
</form>

</body>
</html>
